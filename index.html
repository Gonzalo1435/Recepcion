<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recepción en terreno</title>
<meta name="description" content="Registro de equipos médicos en bodega sin internet: foto de placa, serie y accesorios.">
<meta name="theme-color" content="#0c5a61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terreno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Una columna para el pulgar, botones grandes, tipografía del sistema (funciona sin internet). */
:root{
  --paper:#f3f5f1; --surface:#fff; --sunk:#e9edea; --ink:#16232a; --muted:#56676f; --line:#d3dad6;
  --accent:#0c5a61; --accent-ink:#fff; --accent-soft:#dcebea;
  --warn:#a86200; --warn-bg:#fff1d6; --ok:#2c7a31; --ok-bg:#e3f1e1; --bad:#b0281f; --bad-bg:#fbe3df;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f171b; --surface:#162127; --sunk:#1c2a31; --ink:#e4ebe8; --muted:#94a5ab; --line:#2a3940;
  --accent:#55b6bd; --accent-ink:#04201f; --accent-soft:#18343a;
  --warn:#f0a63a; --warn-bg:#3a2b0f; --ok:#71c376; --ok-bg:#163019; --bad:#f17b6f; --bad-bg:#3b1713; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171b; --surface:#162127; --sunk:#1c2a31; --ink:#e4ebe8; --muted:#94a5ab; --line:#2a3940;
  --accent:#55b6bd; --accent-ink:#04201f; --accent-soft:#18343a;
  --warn:#f0a63a; --warn-bg:#3a2b0f; --ok:#71c376; --ok-bg:#163019; --bad:#f17b6f; --bad-bg:#3b1713; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font-size:22px;line-height:1.2;margin:4px 0 0}
h3{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px} .mono{font-family:var(--mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);position:relative;overflow:hidden}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:58px;font-size:18px;width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;cursor:pointer;min-height:44px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--ink)}
.card .grow{flex:1;min-width:0}
.card .t{font-weight:650;line-height:1.25}
.card .s{font-size:14px;color:var(--muted);margin-top:2px}
.count{font-size:22px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.count small{font-size:14px;color:var(--muted);font-weight:500}
.count.done{color:var(--ok)} .count.over{color:var(--warn)}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.alert{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.alert.warn{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.alert.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.alert.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
label.f{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=search],textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:46px}
textarea{min-height:80px;resize:vertical}
.serie{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.02em}
.foto{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--sunk);display:block}
.gs1{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:14px}
.gs1 span{display:block;color:var(--muted);font-size:12px}
.gs1 b{font-family:var(--mono);word-break:break-all}
.cbx{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.cbx input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.comp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.comp.falta{border-color:var(--warn);background:var(--warn-bg)}
.comp .cl{display:flex;align-items:center;gap:8px}
.comp .cl .cbx{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{display:flex;align-items:center;justify-content:center;min-height:46px;cursor:pointer;font-weight:600;font-size:15px;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent-ink)}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--sunk)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.foot .in>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:20;max-width:calc(100% - 32px);font-size:15px;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.status{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.dot.ok{background:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:20px}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="zxing-reader.js"></script>
<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
